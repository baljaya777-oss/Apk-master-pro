name: APK MASTER PRO - Build Android APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build APK
runs-on: ubuntu-latest

steps:
  - name: Ambil kode repository
    uses: actions/checkout@v4

  - name: Siapkan Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Siapkan Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Siapkan Android SDK
    uses: android-actions/setup-android@v3

  - name: Periksa proyek Android
    run: |
      if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
        echo "::error::File konfigurasi Android Gradle belum tersedia."
        echo "Tambahkan proyek Android WebView terlebih dahulu."
        exit 1
      fi

  - name: Build APK Debug
    run: gradle assembleDebug

  - name: Unggah APK hasil build
    uses: actions/upload-artifact@v4
    with:
      name: APK-MASTER-PRO
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
